# notification-service: its own Postgres + the service itself.
# Depends on 07-kafka.yaml (kafka, mailpit). Build the image into minikube first:
#   minikube image build -t spring-boot-0-notification-service:latest ./notification-service

# ---------- notifications DB ----------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-notifications
  namespace: ecommerce
spec:
  serviceName: postgres-notifications
  replicas: 1
  selector:
    matchLabels:
      app: postgres-notifications
  template:
    metadata:
      labels:
        app: postgres-notifications
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: notifications
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: db-credentials, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: password } }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-notifications
  namespace: ecommerce
spec:
  clusterIP: None
  selector:
    app: postgres-notifications
  ports:
    - port: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: ecommerce
data:
  DB_URL: jdbc:postgresql://postgres-notifications:5432/notifications
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  # One consumer thread per partition. With N replicas, Kafka splits the 3 partitions across
  # N x 3 threads — anything beyond 3 in total sits idle, so scaling past 3 pods buys nothing.
  KAFKA_LISTENER_CONCURRENCY: "1"
---
# ---------- notification-service ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  replicas: 2   # two members of one consumer group: partitions are shared, each event handled once
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        # For a Prometheus that discovers targets by annotation. kube-prometheus-stack (06) uses
        # ServiceMonitors instead — see the one at the bottom of this file.
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8083"
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-notifications 5432 && nc -z kafka 9092; do echo "waiting for db + kafka"; sleep 2; done']
      containers:
        - name: notification-service
          image: spring-boot-0-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef: { name: notification-service-config }
          env:
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: db-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: password } }
            - name: JWT_SECRET
              value: dev-secret-change-me-please-0123456789abcdef0123456789abcdef
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecommerce
  labels:
    app: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
# Prometheus Operator (kube-prometheus-stack from 06-monitoring-values.yaml) scrapes via this.
# Useful series: kafka_consumer_fetch_manager_records_lag_max (consumer lag),
# notifications_stock_low_handled_total{outcome}, notifications_stock_low_dead_letters_total.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  selector:
    matchLabels:
      app: notification-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
