spring.application.name=product-service
server.port=${SERVER_PORT:8081}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# Flyway owns the schema; Hibernate only validates that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
# Migrations are schema only (no sample data). Test data is created via the API.
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# JWT resource server — MUST match the monolith's signing secret (shared HMAC key)
jwt.secret=${JWT_SECRET:dev-secret-change-me-please-0123456789abcdef0123456789abcdef}

# Kafka — low-stock events (product-service is the PRODUCER of stock.low)
# Local default: the compose broker's EXTERNAL listener. Containers override with kafka:29092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# No __TypeId__ header: it would carry this service's Java class name, coupling the consumer
# to our package layout. The consumer decides what type to read the JSON into.
spring.kafka.producer.properties.spring.json.add.type.headers=false
# acks=all + idempotence: the broker confirms only once the write is durable, and producer
# retries can't create duplicates on the broker. (Consumers still dedupe — see eventId.)
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# send() blocks while it fetches metadata. It runs on the request thread after commit, so a dead
# broker must not hold an HTTP request for the default 60s.
spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:3000}
# Don't hang startup if the broker is down; topic creation is retried on the next admin call.
spring.kafka.admin.fail-fast=false

app.kafka.topics.stock-low=stock.low
app.kafka.topics.partitions=3
app.kafka.topics.replicas=${KAFKA_TOPIC_REPLICAS:1}

# Low-stock alert fires when stock CROSSES this value on the way down (before > t, after <= t)
stock.low-threshold=${STOCK_LOW_THRESHOLD:5}

# Actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
