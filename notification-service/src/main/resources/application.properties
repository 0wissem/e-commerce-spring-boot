spring.application.name=notification-service
server.port=${SERVER_PORT:8083}

# Database — notification-service owns its own Postgres (the notifications table)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5437/notifications}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — Flyway owns the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT resource server — same shared HMAC secret as the other services
jwt.secret=${JWT_SECRET:dev-secret-change-me-please-0123456789abcdef0123456789abcdef}

# ---------- Kafka: notification-service is a CONSUMER of stock.low ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# The consumer GROUP is the identity Kafka tracks offsets for. Every instance of this service
# shares it, so partitions are split between instances (3 partitions -> at most 3 useful consumers).
spring.kafka.consumer.group-id=notification-service
# A brand-new group starts from the oldest retained event instead of only new ones.
spring.kafka.consumer.auto-offset-reset=earliest
# ErrorHandlingDeserializer wraps the real deserializers. Without it, one malformed message
# throws INSIDE poll(), before any listener code runs — the consumer re-polls the same offset
# forever and the whole partition is stuck behind a poison pill.
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# WE choose the target type; the producer's Java class names never matter here.
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=org.example.notificationservice.notification.application.dto.StockLowEvent
# Commit the offset after EACH record is handled — a crash re-delivers at most the one in flight.
spring.kafka.listener.ack-mode=record

app.kafka.topics.stock-low=stock.low
app.kafka.topics.stock-low-dlt=stock.low.DLT
app.kafka.topics.partitions=3
app.kafka.topics.replicas=${KAFKA_TOPIC_REPLICAS:1}
app.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:3}
# Retries for TRANSIENT failures (SMTP down): 1s, 2s, 4s — then the record goes to the DLT.
app.kafka.retry.initial-interval-ms=${KAFKA_RETRY_INITIAL_MS:1000}
app.kafka.retry.multiplier=2.0
app.kafka.retry.max-retries=${KAFKA_RETRY_MAX:3}

# ---------- Email (Mailpit locally: SMTP 1025, inbox http://localhost:8025) ----------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
notification.mail.from=${NOTIFICATION_MAIL_FROM:no-reply@shop.local}
notification.stock-low.recipient=${NOTIFICATION_STOCK_RECIPIENT:stock-team@shop.local}

# Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
